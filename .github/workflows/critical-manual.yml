name: Critical Tests (Manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Стенд для запуска тестов'
        required: true
        default: 'dev2'
        type: choice
        options:
          - dev2
          - dev1
          - dev3
      task:
        description: 'Номер задачи - W3-XXXX'
        required: true
        type: string

# Все VPN-раны делят один WireGuard-ключ (secret WG_CLIENT_CONFIG): два параллельных
# туннеля с одним ключом перехватывают сессию друг у друга, и у обоих ранов сеть до
# стендов начинает виснуть. Общая группа на все workflow с VPN — второй ран ждёт в
# очереди, а не ломает первый.
concurrency:
  group: wireguard-vpn
  cancel-in-progress: false

jobs:

  critical:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # публикация отчёта в ветку gh-pages

    steps:
      - uses: actions/checkout@v4

      - name: Load environment config
        run: |
          case "${{ inputs.environment }}" in
            dev1) grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .env.web3tv  >> $GITHUB_ENV ;;
            dev3) grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .env.web3tv3 >> $GITHUB_ENV ;;
            *)    grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .env.web3tv2 >> $GITHUB_ENV ;;
          esac

      - name: Link Jira task
        run: |
          echo "### Jira Task" >> $GITHUB_STEP_SUMMARY
          echo "[${{ inputs.task }}](${{ secrets.JIRA_BASE_URL }}/browse/${{ inputs.task }})" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install WireGuard
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools iproute2

      - name: Connect VPN
        env:
          WG_CLIENT_CONFIG: ${{ secrets.WG_CLIENT_CONFIG }}
        run: |
          printf "%s\n" "$WG_CLIENT_CONFIG" > wg0.conf
          sudo install -m 600 wg0.conf /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          sudo ip route replace 10.3.0.0/16 dev wg0
          rm -f wg0.conf

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install --with-deps

      # timeout-minutes: apt-зеркала раннера иногда виснут — падаем за 10 минут
      # с понятной причиной, а не съедаем весь бюджет job'а (см. run 32083900589)
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: npx playwright install-deps

      - run: npx playwright test --project=functional --grep @critical
        env:
          CI: true

      - name: Generate artifact report
        if: always()
        run: npm run report:artifact

      - if: always()
        run: sudo wg-quick down wg0

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-report
          path: playwright-report

      - name: Publish report to GitHub Pages
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_SLUG: critical
          REPORT_TITLE: Critical Tests
          REPORT_STATUS: ${{ job.status }}
        run: .github/scripts/publish-report.sh

      - name: Send Slack notification
        if: always()
        env:
          STATUS: ${{ job.status }}
          ENVIRONMENT: ${{ inputs.environment }}
          TASK: ${{ inputs.task }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          LABEL="${ENVIRONMENT}${TASK:+ | $TASK}"
          curl -X POST \
            -H "Content-Type: application/json" \
            --data "{\"message\":\"Critical Tests [$LABEL]\nStatus: $STATUS\n$RUN_URL${REPORT_URL:+\nОтчёт: $REPORT_URL}${REPORT_FULL_URL:+\nPlaywright: $REPORT_FULL_URL}\"}" \
            "$WEBHOOK"

      - name: Comment on Jira task
        if: always()
        env:
          STATUS: ${{ job.status }}
          ENVIRONMENT: ${{ inputs.environment }}
          TASK: ${{ inputs.task }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          BODY=$(jq -nc \
            --arg label "Autotests [$ENVIRONMENT]: $STATUS — " \
            --arg url "$RUN_URL" \
            '{body: {type: "doc", version: 1, content: [{type: "paragraph", content: [
              {type: "text", text: $label},
              {type: "text", text: "View run →", marks: [{type: "link", attrs: {href: $url}}]}
            ]}]}}')
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Basic $(printf '%s:%s' "$JIRA_EMAIL" "$JIRA_API_TOKEN" | base64 -w 0)" \
            --data "$BODY" \
            "$JIRA_BASE_URL/rest/api/3/issue/$TASK/comment"
