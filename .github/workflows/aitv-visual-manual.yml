name: AITV Visual Tests (Manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Стенд для запуска тестов'
        required: true
        default: 'dev2'
        type: choice
        options:
          - dev2
          - dev1
      update_snapshots:
        description: 'Обновить базовые снапшоты (--update-snapshots)'
        required: false
        default: false
        type: boolean
      task:
        description: 'Номер задачи - W3-XXXX (необязательно)'
        required: false
        type: string

# Все VPN-раны делят один WireGuard-ключ (secret WG_CLIENT_CONFIG): два параллельных
# туннеля с одним ключом перехватывают сессию друг у друга, и у обоих ранов сеть до
# стендов начинает виснуть. Общая группа на все workflow с VPN — второй ран ждёт в
# очереди, а не ломает первый.
concurrency:
  group: wireguard-vpn
  cancel-in-progress: false

jobs:

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # публикация отчёта в ветку gh-pages

    steps:
      - uses: actions/checkout@v4

      - name: Load environment config
        run: |
          if [ "${{ inputs.environment }}" = "dev1" ]; then
            grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .env.web3tv >> $GITHUB_ENV
          else
            grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .env.web3tv2 >> $GITHUB_ENV
          fi

      - name: Link Jira task
        if: ${{ inputs.task != '' }}
        run: |
          echo "### Jira Task" >> $GITHUB_STEP_SUMMARY
          echo "[${{ inputs.task }}](${{ secrets.JIRA_BASE_URL }}/browse/${{ inputs.task }})" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY

      - name: Install WireGuard
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools iproute2

      - name: Connect VPN
        env:
          WG_CLIENT_CONFIG: ${{ secrets.WG_CLIENT_CONFIG }}
        run: |
          printf "%s\n" "$WG_CLIENT_CONFIG" > wg0.conf
          sudo install -m 600 wg0.conf /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          sudo ip route replace 10.3.0.0/16 dev wg0
          rm -f wg0.conf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build Docker image
        run: docker build -t aitv-test .

      - name: Run visual tests
        run: |
          SNAPSHOT_FLAG=""
          if [ "${{ inputs.update_snapshots }}" = "true" ]; then
            SNAPSHOT_FLAG="--update-snapshots"
          fi
          docker run --rm \
            --network host \
            -v "$PWD:/app" \
            -e BASE_URL="$BASE_URL" \
            -e API_URL="$API_URL" \
            -e STUDIO_URL="$STUDIO_URL" \
            -e USER_PASSWORD="$USER_PASSWORD" \
            -e USER_LOGIN_ADMIN="$USER_LOGIN_ADMIN" \
            -e CI=true \
            aitv-test \
            npx playwright test \
              --project=visual-desktop-chromium \
              --project=visual-mobile-webkit \
              $SNAPSHOT_FLAG

      - name: Generate artifact report
        if: always()
        run: npm run report:artifact

      - if: always()
        run: sudo wg-quick down wg0

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aitv-visual-report
          path: playwright-report

      - name: Publish report to GitHub Pages
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_SLUG: visual
          REPORT_TITLE: AITV Visual Tests
          REPORT_STATUS: ${{ job.status }}
        run: .github/scripts/publish-report.sh

      - name: Commit and push updated snapshots
        if: inputs.update_snapshots == true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if git diff --quiet; then
            echo "No snapshot changes detected"
            exit 0
          fi
          
          git add tests/visual
          git commit -m "chore: update visual snapshots"
          git push

      - name: Send Slack notification
        if: always()
        env:
          STATUS: ${{ job.status }}
          ENVIRONMENT: ${{ inputs.environment }}
          TASK: ${{ inputs.task }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          LABEL="${ENVIRONMENT}${TASK:+ | $TASK}"
          curl -X POST \
            -H "Content-Type: application/json" \
            --data "{\"message\":\"AITV Visual Tests [$LABEL]\nStatus: $STATUS\n$RUN_URL${REPORT_URL:+\nОтчёт: $REPORT_URL}${REPORT_FULL_URL:+\nPlaywright: $REPORT_FULL_URL}\"}" \
            "$WEBHOOK"

      - name: Comment on Jira task
        if: ${{ always() && inputs.task != '' }}
        env:
          STATUS: ${{ job.status }}
          ENVIRONMENT: ${{ inputs.environment }}
          TASK: ${{ inputs.task }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          BODY=$(jq -nc \
            --arg label "AITV Visual Tests [$ENVIRONMENT]: $STATUS — " \
            --arg url "$RUN_URL" \
            '{body: {type: "doc", version: 1, content: [{type: "paragraph", content: [
              {type: "text", text: $label},
              {type: "text", text: "View run →", marks: [{type: "link", attrs: {href: $url}}]}
            ]}]}}')
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Basic $(printf '%s:%s' "$JIRA_EMAIL" "$JIRA_API_TOKEN" | base64 -w 0)" \
            --data "$BODY" \
            "$JIRA_BASE_URL/rest/api/3/issue/$TASK/comment"
