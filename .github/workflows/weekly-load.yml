name: Weekly Load (k6, prod)

on:
  schedule:
    # Воскресенье 06:00 UTC — окно низкого трафика. Не пересекается с ночной
    # регрессией (02:00) и прод-смоуком (00:00).
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Профиль нагрузки (smoke = 10 VU/3.5m, full = 100 VU/11m)'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - full

env:
  # На schedule inputs пустые. По умолчанию — smoke: регулярный ран не должен
  # сам эскалироваться до 100 VU без явного выбора. full запускаем осознанно.
  PROFILE: ${{ github.event.inputs.profile || 'smoke' }}

# Один нагрузочный ран за раз — два параллельных прогона по проду смажут замеры
# и удвоят нагрузку на живой стенд.
concurrency:
  group: load-tests-prod
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Load prod config
        run: grep -E '^(BASE_URL|API_URL)=' .env.prod >> $GITHUB_ENV

      - name: Run summary
        run: |
          echo "### Weekly Load (k6, prod)" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** $BASE_URL" >> $GITHUB_STEP_SUMMARY
          echo "**Profile:** $PROFILE" >> $GITHUB_STEP_SUMMARY

      - uses: grafana/setup-k6-action@v1

      - name: Run k6 load
        run: |
          k6 run load/scenarios/prodHomepage.js \
            --env BASE_URL="$BASE_URL" \
            --env PROFILE="$PROFILE" \
            --summary-export k6-summary.json

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-summary
          path: k6-summary.json

      # Достаём из summary серверные метрики (TTFB — норма/регресс) для Slack.
      # if: always() — порог по TTFB валит предыдущий шаг, но метрики всё равно нужны.
      - name: Parse k6 metrics
        if: always()
        run: |
          python3 - <<'PY' >> $GITHUB_ENV
          import json, os
          try:
              m = json.load(open('k6-summary.json'))['metrics']
          except Exception:
              # k6 не дошёл до записи summary (упал на старте / нет файла).
              for k in ('TTFB_MED','TTFB_P95','FAIL_PCT','CHECKS_PCT','REQS'):
                  print(f'{k}=n/a')
              raise SystemExit(0)
          def sec(metric, key):
              v = m.get(metric, {}).get(key)
              return f'{v/1000:.2f}s' if v is not None else 'n/a'
          def pct(metric):
              v = m.get(metric, {}).get('value')
              return f'{v*100:.2f}%' if v is not None else 'n/a'
          print(f"TTFB_MED={sec('http_req_waiting','med')}")
          print(f"TTFB_P95={sec('http_req_waiting','p(95)')}")
          print(f"FAIL_PCT={pct('http_req_failed')}")
          print(f"CHECKS_PCT={pct('checks')}")
          print(f"REQS={m.get('http_reqs',{}).get('count','n/a')}")
          PY

      - name: Send Slack notification
        if: always()
        env:
          STATUS: ${{ job.status }}
          PROFILE: ${{ env.PROFILE }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data "{\"message\":\"Weekly Load [prod, $PROFILE]\nStatus: $STATUS\nTTFB (сервер): med $TTFB_MED · p95 $TTFB_P95 (норма p95 < 3s)\nОшибки: $FAIL_PCT · checks: $CHECKS_PCT · запросов: $REQS\n$RUN_URL\"}" \
            "$WEBHOOK"
